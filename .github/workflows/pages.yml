name: Deploy site to GitHub Pages

# Builds ctx/www (homepage + static pages + the Quartz garden) and deploys it to
# GitHub Pages via the official Pages artifact — no gh-pages branch.
#
# BUILD-SCOPE ISOLATION (privacy enforcement point (a)): every step below reads
# ONLY ctx/www. NO step reads ctx/vault. The vault is never an input to the
# deployed artifact. The publish tool's PROJECTOR (which does read the vault) is
# run locally by a human and its output committed under ctx/www — CI only builds
# already-committed, already-gated content.
#
# The vault-blind re-audit below (enforcement point (b)) then re-checks that
# committed content on its own terms, so a hand-edit after projection is caught.
#
# OPT-IN: the deploy job below is skipped unless the repo variable ENABLE_PAGES is
# "true" — this is one of TWO supported publishing topologies (the other projects
# into a separate garden repo served by the VPS/Caddy stack), and a repo using the
# other one should not go red for a deploy it never wanted.
#
# One-time setup to publish here: Settings → Pages → Source = "GitHub Actions",
# then set repo variable ENABLE_PAGES = true.
# Optional: set a repo variable SITE_CUSTOM_DOMAIN (e.g. example.com) for a custom
# domain; unset → served at https://<owner>.github.io/<repo>/ with zero config.

on:
  push:
    branches: [master, main]
    paths:
      - 'ctx/www/**'
      - 'ctx/tools/pub/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ctx/www/garden/.node-version # Quartz pins Node 22
          cache: npm
          cache-dependency-path: |
            ctx/www/garden/package-lock.json
            ctx/tools/pub/package-lock.json

      # Fail-closed publish gate (enforcement point (b)) — VAULT-BLIND. Re-audits the
      # committed public projection (ctx/www/garden only): a wikilink to an unpublished
      # note (which would render its title — the leak), a missing asset, a disallowed
      # frontmatter key, a surviving internal tag, or a stale manifest entry exits
      # nonzero and BREAKS THE DEPLOY before anything is built or uploaded.
      #
      # It takes no --vault and refuses one, so this step cannot be "fixed" into
      # reading the private side. Runs FIRST — nothing is built until it passes.
      - name: Verify publish gate (vault-blind)
        working-directory: ctx/tools/pub
        run: |
          npm ci
          npm run verify

      - name: Compute Quartz baseUrl
        id: base
        env:
          SITE_CUSTOM_DOMAIN: ${{ vars.SITE_CUSTOM_DOMAIN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          owner_lc=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          if [ -n "$SITE_CUSTOM_DOMAIN" ]; then
            baseurl="${SITE_CUSTOM_DOMAIN}/garden"
          elif [ "$REPO" = "${owner_lc}.github.io" ]; then
            # user/org page → served at domain root, no /<repo> prefix
            baseurl="${owner_lc}.github.io/garden"
          else
            baseurl="${owner_lc}.github.io/${REPO}/garden"
          fi
          echo "baseurl=$baseurl" >> "$GITHUB_OUTPUT"
          echo "Computed Quartz baseUrl: $baseurl"
          sed -i "s|^  baseUrl:.*|  baseUrl: ${baseurl}|" ctx/www/garden/quartz.config.yaml

      - name: Build garden (Quartz)
        working-directory: ctx/www/garden
        run: |
          npm ci
          npx quartz plugin install   # fetch pinned plugin commits from quartz.lock.json
          npx quartz build            # -> ctx/www/garden/public

      - name: Assemble _site
        env:
          SITE_CUSTOM_DOMAIN: ${{ vars.SITE_CUSTOM_DOMAIN }}
        run: |
          mkdir -p _site
          # Everything in ctx/www EXCEPT the garden project + the internal README →
          # site root, verbatim (homepage + any static pages/assets).
          rsync -a --exclude 'garden' --exclude 'README.md' ctx/www/ _site/
          # Quartz build output → /garden subpath.
          mkdir -p _site/garden
          cp -r ctx/www/garden/public/. _site/garden/
          # Pages must not run Jekyll over Quartz's _-prefixed assets.
          touch _site/.nojekyll
          # Root CNAME drives Pages custom-domain routing when configured.
          if [ -n "$SITE_CUSTOM_DOMAIN" ]; then echo "$SITE_CUSTOM_DOMAIN" > _site/CNAME; fi
          echo "Assembled _site:"; ls -A _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Self-skips until you opt in, the same way deploy-api.yml self-skips while
  # VPS_HOST is empty. actions/deploy-pages 404s ("Failed to create deployment")
  # if Pages was never enabled on the repo, which would put a permanent red X on
  # a repo that simply doesn't publish this way — the VPS/Caddy garden is the
  # other supported topology. The BUILD job above always runs, so ctx/www and the
  # publish gate are still validated on every push either way.
  #
  # To publish here: Settings → Pages → Source = "GitHub Actions", then set the
  # repo VARIABLE (not secret) ENABLE_PAGES = true.
  deploy:
    needs: build
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
