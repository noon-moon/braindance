name: Build & deploy api

# Build the api image, push it to GHCR, then SSH to the droplet and redeploy —
# so a change on `main` ships in one step instead of waiting for the box to
# notice. CI is the PRIMARY path; `braindance-sync.timer` on the host stays on
# as a slow fallback (see ops/README.md) so a failed or skipped run still
# self-heals eventually rather than leaving the box silently stale.
#
# This used to be the other way round — the timer deployed and this job was
# inert scaffolding. That arrangement had one bad property worth stating,
# because it is the reason this file changed: the deploy job SELF-SKIPPED and
# still reported success, so a green "Build & deploy api" run proved the image
# was BUILT and said nothing about whether it was DEPLOYED. It is still allowed
# to skip (a fresh clone has no droplet), but it now says so loudly — a warning
# annotation and a line in the run summary — so green never means "shipped"
# by accident again.
#
# ONE TAG: `:latest`, which always means the newest build of the default branch.
# Deployments track it — that is the whole scheme.
#
# There was briefly a versioned one (per-commit releases, `:X.Y.Z`, `:edge`,
# reusable-workflow plumbing). It was removed as more machinery than a personal
# deployment earns. Rolling back is still possible without it: `/health` reports
# the commit SHA the container is running, and any previous image can be pinned
# by digest — `API_IMAGE=ghcr.io/OWNER/REPO/api@sha256:<digest>`, which the
# GitHub Packages page lists. Reach for tags again when more than one machine
# runs this and they need to differ.
#
# The `v0.1.0` / `v0.2.0` releases and their images predate the removal. They are
# left in place — they are valid pins and cost nothing.

on:
  push:
    # main (fork instances) + master (this template repo's default branch) — so
    # the image builds whichever branch a given repo deploys from.
    branches: [main, master]
    paths:
      - "api/**"
      - "docker-compose.yml"
      # Deploy config the box runs but the image doesn't contain. These are here
      # because the host timer used to ship them by polling; with CI as the
      # primary path, a trigger that only watched `api/**` would mean a Caddyfile
      # change reached the box whenever the fallback next fired, or never.
      - "Caddyfile"
      - "ops/**"
      - "deploy.sh"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  # One build per commit, so superseding an in-flight one is safe: whatever it
  # would have published and deployed, the newer run publishes and deploys.
  group: deploy-api
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          # Resolves to ghcr.io/<owner>/<repo>/api:latest for whatever repo this
          # runs in (a fork resolves to that fork's path), matching API_IMAGE in
          # the host's /srv/.env.
          tags: ghcr.io/${{ github.repository }}/api:latest
          # Surfaced at /health, and the deploy job below GATES on it: the box
          # has to come back reporting this exact SHA or the run fails. It is
          # also how you identify which image to pin if you need to roll back.
          build-args: |
            BUILD_SHA=${{ github.sha }}

  deploy:
    needs: build-push # ordering guard: only redeploy after the image is pushed
    runs-on: ubuntu-latest
    env:
      # Empty on a clone with no droplet yet — the deploy then skips LOUDLY
      # rather than silently, so the run's colour still means something.
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: No deploy target configured
        if: env.VPS_HOST == ''
        run: |
          echo "::warning title=Deploy skipped::VPS_HOST is not set. The image was built and pushed to GHCR, but nothing was deployed."
          {
            echo "### ⚠️ Deploy skipped"
            echo
            echo "The image was **built and pushed**, but no \`VPS_HOST\` secret is set, so nothing was deployed."
            echo "Set \`VPS_HOST\`, \`VPS_USER\` and \`VPS_SSH_KEY\` to enable push deploys."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SSH to droplet and redeploy
        if: env.VPS_HOST != ''
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" "WANT_SHA=${{ github.sha }} bash -s" <<'REMOTE'
          set -uo pipefail
          cd /srv/braindance || { echo "::error::/srv/braindance missing on the host"; exit 1; }

          # 1. Deploy CONFIG (compose, ops, Caddyfile) — the half of a deploy the
          #    image doesn't carry. The host timer did this by polling; doing it
          #    here is what lets the timer drop to a slow fallback.
          #
          #    Guarded on VAULT_EXTERNAL exactly as ops/sync.sh is: pre-cutover the
          #    api owns THIS checkout read-write and drives its own rebase, so an
          #    outside ff-only pull would race its commits. Post-cutover the vault
          #    is a separate checkout and /srv/braindance is config the api never
          #    writes, which is what makes pulling it safe.
          #    A failed pull is a HARD FAILURE, not a warning. The predecessor of
          #    this step swallowed it (`git pull --ff-only 2>/dev/null || true`)
          #    and the box's config sat frozen for a month behind two stacked
          #    causes — a root-owned checkout the deploy user couldn't write, and
          #    a re-rooted master it could never fast-forward onto — while every
          #    run stayed green because the image half kept working. Config that
          #    silently stops shipping is worse than a red X.
          VAULT_EXTERNAL=$(awk -F= '$1=="VAULT_EXTERNAL"{gsub(/["'"'"' ]/,"",$2); print $2}' /srv/.env 2>/dev/null)
          before=$(git rev-parse HEAD 2>/dev/null || echo none)
          config_failed=
          case "$VAULT_EXTERNAL" in
            1|true|yes)
              git pull --ff-only || config_failed=1
              ;;
            *) echo "note: VAULT_EXTERNAL unset — skipping config pull (the api owns this checkout)" ;;
          esac
          after=$(git rev-parse HEAD 2>/dev/null || echo none)

          # 2. The image.
          ./deploy.sh pull api || { echo "::error::docker pull failed"; exit 1; }
          ./deploy.sh up -d api || { echo "::error::compose up failed"; exit 1; }

          # 3. Caddy, only when its config actually moved. Reload rather than
          #    recreate: Caddy is the one container on :80/:443, so bouncing it
          #    for an api deploy would take the public site down for no reason.
          if [ "$before" != "$after" ] && ! git diff --quiet "$before" "$after" -- Caddyfile 2>/dev/null; then
            echo "Caddyfile changed — reloading caddy"
            ./deploy.sh exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile \
              || ./deploy.sh up -d caddy
          fi

          # 4. PROVE it. Without this the job is green whenever ssh and docker
          #    exited 0, which is not the same as "the new code is serving".
          #    The api binds to the tailnet address, so ask it there, from the box.
          TS_IP=$(awk -F= '$1=="TAILSCALE_IP"{gsub(/["'"'"' ]/,"",$2); print $2}' /srv/.env 2>/dev/null)
          [ -n "$TS_IP" ] || TS_IP=127.0.0.1
          for i in $(seq 1 20); do
            got=$(curl -fsS --max-time 3 "http://$TS_IP:3000/health" 2>/dev/null \
                  | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
            if [ "$got" = "$WANT_SHA" ]; then
              echo "deployed: $got"
              # The image shipped. Say so, then still fail if the config didn't —
              # a deploy that lands half of itself must not report success.
              if [ -n "$config_failed" ]; then
                echo "::error::image deployed, but the deploy-config pull FAILED — /srv/braindance is stale. Check ownership (must be writable by the deploy user) and that its history can fast-forward onto origin."
                exit 1
              fi
              exit 0
            fi
            sleep 3
          done
          echo "::error::deploy did not take — /health reports '${got:-unreachable}', expected '$WANT_SHA'"
          exit 1
          REMOTE

      - name: Record what shipped
        if: env.VPS_HOST != '' && success()
        run: |
          {
            echo "### ✅ Deployed"
            echo
            echo "\`${{ github.sha }}\` is live and \`/health\` confirms it."
          } >> "$GITHUB_STEP_SUMMARY"
