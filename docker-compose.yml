# The public stack: Caddy, and nothing else.
#
# The admin api used to live here too — a Hono app that owned a read-write
# checkout of the vault and served capture, triage, the task roll-up and a
# viewer. It is gone. Obsidian is the interface now, obsidian-git is the
# transport, and the only thing left running on the box is a systemd timer
# (ops/braindance-applier.timer) that classifies captures and files the ones you
# have answered. It needs no container and no port.
#
# Run via ./deploy.sh rather than bare `docker compose`, so ${VAR} interpolation
# reads /srv/.env — `env_file:` only sets *container* env, never interpolation.
services:
  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    # Caddy needs exactly one variable, so it gets exactly one — by interpolation
    # rather than `env_file: /srv/.env`, which would hand the whole secret file
    # to the only container published on 0.0.0.0:80/443. Least privilege for the
    # most exposed service, and it matters more now that ANTHROPIC_API_KEY lives
    # in that file for the applier's benefit.
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in /srv/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - /srv/www:/srv/www:ro
      - /srv/garden:/srv/garden:ro
    restart: unless-stopped

volumes:
  caddy_data:
